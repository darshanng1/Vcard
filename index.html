<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Darshan N G | SIPC Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-green: #10b981;
        --brand-black: #09090b;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #000000;
        margin: 0;
        padding: 0;
        color: #ffffff;
        overflow: hidden;
      }
      .app-container {
        max-width: 500px;
        margin: 0 auto;
        background: #09090b;
        height: 100dvh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      
      /* 🏙️ Environmental Background Layers */
      .bg-layers {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      /* 🐜 Industry Textures */
      .texture-termite {
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10 Q 30 50 10 90 M50 10 Q 70 50 50 90 M90 10 Q 110 50 90 90' stroke='rgba(16, 185, 129, 0.05)' fill='transparent' stroke-width='0.5'/%3E%3C/svg%3E");
        opacity: 0.4;
      }

      .texture-bird-net {
        background-image: linear-gradient(rgba(16, 185, 129, 0.08) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(16, 185, 129, 0.08) 1px, transparent 1px);
        background-size: 18px 18px;
        opacity: 0.6;
      }

      .balcony-railing {
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        width: 100%;
      }

      .silhouette {
        filter: brightness(0) invert(0.2) opacity(0.12) blur(2px);
      }

      .text-heading { font-family: 'Space Grotesk', sans-serif; }
      
      @keyframes light-sweep {
        0% { transform: translateX(-150%) rotate(45deg); }
        100% { transform: translateX(250%) rotate(45deg); }
      }
      .sweep-effect::after {
        content: '';
        position: absolute;
        top: -100%;
        left: -100%;
        width: 60%;
        height: 300%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
        animation: light-sweep 12s infinite ease-in-out;
        pointer-events: none;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      .breathe-glow {
        animation: breathe 5s ease-in-out infinite;
      }

      .glass {
        background: rgba(10, 10, 12, 0.5);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .premium-frame {
        position: relative;
        padding: 4px;
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), transparent, rgba(16, 185, 129, 0.3));
        border-radius: 4rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .magnetic-action {
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .magnetic-action:active {
        transform: scale(0.94);
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Sterile Shine Effect */
      .sterile-overlay {
        background: linear-gradient(180deg, rgba(9, 9, 11, 0) 0%, rgba(9, 9, 11, 0.8) 100%);
        position: absolute;
        inset: 0;
      }
    </style>
