  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Darshan N G | SIPC Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-green: #10b981;
        --brand-black: #09090b;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #000000;
        margin: 0;
        padding: 0;
        color: #ffffff;
        overflow: hidden;
      }
      .app-container {
        max-width: 500px;
        margin: 0 auto;
        background: #09090b;
        height: 100dvh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      
      /* Cinematic Background Layers */
      .bg-layers {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .mesh-gradient {
        background: radial-gradient(at 0% 0%, hsla(161, 89%, 30%, 0.12) 0, transparent 60%),
                    radial-gradient(at 100% 100%, hsla(161, 89%, 30%, 0.08) 0, transparent 60%);
        position: absolute;
        inset: 0;
      }

      /* Pest Silhouettes Filters - Sterile & Corporate */
      .silhouette {
        filter: brightness(0) invert(0.2) opacity(0.12) blur(1.5px);
        transition: opacity 1s ease;
      }

      .text-heading { font-family: 'Space Grotesk', sans-serif; }
      
      @keyframes light-sweep {
        0% { transform: translateX(-150%) rotate(45deg); }
        100% { transform: translateX(250%) rotate(45deg); }
      }
      .sweep-effect::after {
        content: '';
        position: absolute;
        top: -100%;
        left: -100%;
        width: 60%;
        height: 300%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
        animation: light-sweep 10s infinite ease-in-out;
        pointer-events: none;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.5; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
        50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
      }
      .breathe-glow {
        animation: breathe 4s ease-in-out infinite;
      }

      .glass {
        background: rgba(10, 10, 12, 0.45);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.07);
      }

      .magnetic-action {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .magnetic-action:active {
        transform: scale(0.92) translateY(2px);
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Specialized Protection Textures */
      .bird-net-grid {
        background-image: linear-gradient(rgba(16, 185, 129, 0.08) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(16, 185, 129, 0.08) 1px, transparent 1px);
        background-size: 15px 15px;
        opacity: 0.4;
      }
      .protection-glow {
        filter: blur(8px);
        background: rgba(16, 185, 129, 0.15);
      }
    </style>
