
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Darshan N G | SIPC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-green: #10b981;
        --brand-black: #09090b;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #000000;
        margin: 0;
        padding: 0;
        color: #ffffff;
        overflow: hidden; /* Prevent body scroll to maintain app feel */
      }
      .app-container {
        max-width: 500px;
        margin: 0 auto;
        background: #09090b;
        height: 100dvh;
        position: relative;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .glass {
        background: rgba(18, 18, 23, 0.6);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .mesh-gradient {
        background: radial-gradient(at 0% 0%, hsla(161, 89%, 30%, 0.1) 0, transparent 50%),
                    radial-gradient(at 100% 0%, hsla(161, 89%, 30%, 0.05) 0, transparent 40%);
      }
      .text-heading { font-family: 'Space Grotesk', sans-serif; }
      .dashboard-card {
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .dashboard-card:active {
        transform: scale(0.92);
      }
      .glow-green { box-shadow: 0 0 25px rgba(16, 185, 129, 0.1); }
      
      /* Hide scrollbar for clean app look */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
