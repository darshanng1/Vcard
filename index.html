    <meta charset="UTF-8" />

    <title>Darshan N G | SIPC Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-green: #10b981;
        --brand-black: #09090b;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #000000;
        margin: 0;
        padding: 0;
        color: #ffffff;
        overflow: hidden;
      }
      .app-container {
        max-width: 500px;
        margin: 0 auto;
        background: #09090b;
        height: 100dvh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      
      /* Background Layering */
      .mesh-gradient {
        background: radial-gradient(at 0% 0%, hsla(161, 89%, 30%, 0.12) 0, transparent 50%),
                    radial-gradient(at 100% 100%, hsla(161, 89%, 30%, 0.08) 0, transparent 50%);
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      /* Pest Expertise Silhouette Animations */
      .pest-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.03;
        z-index: 1;
        overflow: hidden;
      }
      @keyframes float-pest {
        0% { transform: translate(-10%, -10%) rotate(0deg); opacity: 0; }
        20% { opacity: 0.5; }
        80% { opacity: 0.5; }
        100% { transform: translate(110%, 110%) rotate(20deg); opacity: 0; }
      }
      .pest-icon {
        position: absolute;
        width: 100px;
        height: 100px;
        animation: float-pest 20s infinite linear;
      }
      .pest-1 { top: 10%; left: -10%; animation-delay: 0s; }
      .pest-2 { top: 40%; left: -10%; animation-delay: 7s; width: 60px; }
      .pest-3 { top: 70%; left: -10%; animation-delay: 14s; }

      .text-heading { font-family: 'Space Grotesk', sans-serif; }
      
      @keyframes light-sweep {
        0% { transform: translateX(-150%) rotate(45deg); }
        100% { transform: translateX(250%) rotate(45deg); }
      }
      .sweep-effect::after {
        content: '';
        position: absolute;
        top: -100%;
        left: -100%;
        width: 60%;
        height: 300%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
        animation: light-sweep 6s infinite ease-in-out;
        pointer-events: none;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
        50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 25px rgba(16, 185, 129, 0.5); }
      }
      .breathe-glow {
        animation: breathe 4s ease-in-out infinite;
      }

      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .magnetic-action {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .magnetic-action:active {
        transform: scale(0.92) translateY(2px);
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
