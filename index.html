<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Darshan N G | SIPC Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-green: #10b981;
        --brand-black: #09090b;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #000000;
        margin: 0;
        padding: 0;
        color: #ffffff;
        overflow: hidden;
      }
      .app-container {
        max-width: 500px;
        margin: 0 auto;
        background: #09090b;
        height: 100dvh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      
      /* Cinematic Background Layers */
      .bg-layers {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .mesh-gradient {
        background: radial-gradient(at 0% 0%, hsla(161, 89%, 30%, 0.12) 0, transparent 60%),
                    radial-gradient(at 100% 100%, hsla(161, 89%, 30%, 0.08) 0, transparent 60%);
        position: absolute;
        inset: 0;
      }

      /* Subtle Industry Textures */
      .termite-veins {
        background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10 Q 50 50 100 10 T 190 10' stroke='rgba(16, 185, 129, 0.03)' fill='transparent'/%3E%3C/svg%3E");
        opacity: 0.2;
      }

      .bird-net-grid {
        background-image: linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
        background-size: 20px 20px;
      }

      .silhouette {
        filter: brightness(0) invert(0.2) opacity(0.1) blur(2px);
      }

      .text-heading { font-family: 'Space Grotesk', sans-serif; }
      
      @keyframes light-sweep {
        0% { transform: translateX(-150%) rotate(45deg); }
        100% { transform: translateX(250%) rotate(45deg); }
      }
      .sweep-effect::after {
        content: '';
        position: absolute;
        top: -100%;
        left: -100%;
        width: 60%;
        height: 300%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
        animation: light-sweep 12s infinite ease-in-out;
        pointer-events: none;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      .breathe-glow {
        animation: breathe 5s ease-in-out infinite;
      }

      .glass {
        background: rgba(10, 10, 12, 0.45);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.07);
      }

      /* Premium Frame Styles */
      .premium-frame {
        position: relative;
        padding: 4px;
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), transparent, rgba(16, 185, 129, 0.2));
        border-radius: 3.5rem;
      }
      .premium-frame::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 3.6rem;
        padding: 1px;
        background: linear-gradient(to bottom right, rgba(255,255,255,0.2), transparent, rgba(255,255,255,0.1));
        -webkit-mask: linear-gradient(%23fff 0 0) content-box, linear-gradient(%23fff 0 0);
        mask: linear-gradient(%23fff 0 0) content-box, linear-gradient(%23fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }

      .magnetic-action {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .magnetic-action:active {
        transform: scale(0.92) translateY(2px);
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
