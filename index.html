  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Darshan N G | SIPC Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-green: #10b981;
        --brand-black: #09090b;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #000000;
        margin: 0;
        padding: 0;
        color: #ffffff;
        overflow: hidden;
      }
      .app-container {
        max-width: 500px;
        margin: 0 auto;
        background: #09090b;
        height: 100dvh;
        position: relative;
        overflow: hidden; /* Lock scroll for app-feel */
        display: flex;
        flex-direction: column;
      }
      .mesh-gradient {
        background: radial-gradient(at 0% 0%, hsla(161, 89%, 30%, 0.15) 0, transparent 50%),
                    radial-gradient(at 100% 100%, hsla(161, 89%, 30%, 0.1) 0, transparent 50%);
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .text-heading { font-family: 'Space Grotesk', sans-serif; }
      
      @keyframes light-sweep {
        0% { transform: translateX(-100%) rotate(45deg); }
        100% { transform: translateX(200%) rotate(45deg); }
      }
      .sweep-effect::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 40%;
        height: 200%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
        animation: light-sweep 4s infinite linear;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      .breathe-glow {
        animation: breathe 3s ease-in-out infinite;
      }

      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .magnetic-action {
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .magnetic-action:active {
        transform: scale(0.9) translateY(4px);
      }
    </style>
